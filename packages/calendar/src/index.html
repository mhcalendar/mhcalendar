<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>mhcalendar – dev</title>
    <script type="module" src="/build/mhcalendar.esm.js"></script>
    <script nomodule src="/build/mhcalendar.js"></script>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        height: 100%;
        font-family: sans-serif;
      }
      body {
        height: 100vh;
        display: flex;
        flex-direction: column;
      }
    </style>
  </head>
  <body>
    <mh-calendar id="cal"></mh-calendar>

    <script type="module">
      import plLocale from 'https://esm.sh/dayjs@1.11.21/locale/pl';

      const today = new Date();
      const at = (dayOffset, h, m = 0) => {
        const d = new Date(today);
        d.setDate(d.getDate() + dayOffset);
        d.setHours(h, m, 0, 0);
        return d;
      };

      const cal = document.getElementById('cal');

      cal.config = {
        viewType: 'WEEK',
        showTimeFrom: 10,
        showTimeTo: 18,
        createEventOnClick: true,
        theme: 'dark',
        // Pass the imported locale OBJECT, not the 'pl' string — mhcalendar bundles its own
        // Day.js instance, so a side-effect-only "import 'dayjs/locale/pl'" would register
        // the locale on a different instance and have no effect.
        locale: plLocale,
        labels: {
          today: 'Dzisiaj2',
          moreEvents: (hiddenCount) => `+${hiddenCount} więcej`,
          views: { WEEK: 'Tydzień', MONTH: 'Miesiąc', DAY: 'Dzień', AGENDA: 'Plan dnia' },
        },
      };

      cal.events = [
        {
          id: '1',
          title: 'Team standup',
          startDate: at(0, 9),
          endDate: at(0, 9, 30),
          color: '#4A90E2',
        },
        { id: '2', title: 'Lunch', startDate: at(0, 12), endDate: at(0, 13), color: '#7ED321' },
        {
          id: '3',
          title: 'Product review',
          startDate: at(0, 14),
          endDate: at(0, 15, 30),
          color: '#E84393',
        },
        {
          id: '4',
          title: 'Doctor appointment',
          startDate: at(0, 16),
          endDate: at(0, 17),
          color: '#F5A623',
        },
        { id: '5', title: 'Morning jog', startDate: at(1, 7), endDate: at(1, 8), color: '#50E3C2' },
        {
          id: '6',
          title: 'Team standup',
          startDate: at(1, 9),
          endDate: at(1, 9, 30),
          color: '#4A90E2',
        },
        {
          id: '7',
          title: 'Design sync',
          startDate: at(1, 10),
          endDate: at(1, 11),
          color: '#9B59B6',
        },
        {
          id: '8',
          title: 'Sprint planning',
          startDate: at(1, 13),
          endDate: at(1, 15),
          color: '#E74C3C',
        },
        {
          id: '9',
          title: 'Team standup',
          startDate: at(2, 9),
          endDate: at(2, 9, 30),
          color: '#4A90E2',
        },
        {
          id: '10',
          title: 'Coffee with Anna',
          startDate: at(2, 11),
          endDate: at(2, 11, 30),
          color: '#F5A623',
        },
        {
          id: '11',
          title: 'Code review',
          startDate: at(2, 15),
          endDate: at(2, 16),
          color: '#3498DB',
        },
        { id: '12', title: 'Gym', startDate: at(2, 18), endDate: at(2, 19, 30), color: '#2ECC71' },
        {
          id: '13',
          title: 'Team standup',
          startDate: at(3, 9),
          endDate: at(3, 9, 30),
          color: '#4A90E2',
        },
        {
